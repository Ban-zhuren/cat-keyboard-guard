name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application
        shell: powershell
        run: .\tools\Build-CatKeyboardGuard.ps1
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CatKeyboardGuard
          path: CatKeyboardGuard.exe
